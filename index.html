<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>Client05</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

<!-- METARANG_DEFAULT_WEBGL_MOBILE_LANDSCAPE_V2 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<style id="metarang-mobile-landscape-v2-style">
html,
body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  height: 100% !important;
  overflow: hidden !important;
  overscroll-behavior: none;
  background: #000;
}

/*
  مهم:
  قالب Default یونیتی روی دسکتاپ container را با
  left:50%, top:50%, transform:translate(-50%,-50%)
  وسط می‌برد.
  وقتی container را تمام صفحه می‌کنیم باید transform قبلی
  حتماً صفر شود، وگرنه نصف صفحه از viewport بیرون می‌رود.
*/
#unity-container,
#unity-container.unity-desktop,
#unity-container.unity-mobile {
  position: fixed !important;
  left: 0 !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  inset: 0 !important;
  transform: none !important;
  margin: 0 !important;

  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;

  max-width: none !important;
  max-height: none !important;
  overflow: hidden !important;
  background: #000 !important;
}

#unity-canvas,
#unity-container.unity-desktop #unity-canvas,
#unity-container.unity-mobile #unity-canvas {
  display: block !important;

  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;

  max-width: none !important;
  max-height: none !important;

  margin: 0 !important;
  padding: 0 !important;
  outline: none !important;
}

/* Footer و دکمه Fullscreen پیش‌فرض یونیتی دیگر فضای صفحه را نمی‌گیرند. */
#unity-footer {
  display: none !important;
}

/* دکمه ورود اولیه موبایل */
#metarang-mobile-entry {
  position: fixed;
  z-index: 2147483647;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 24px;
  box-sizing: border-box;

  background: #000;
  color: #fff;

  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
}

#metarang-mobile-entry .metarang-card {
  width: min(90vw, 420px);
}

#metarang-mobile-entry button,
#metarang-orientation-warning button {
  width: 100%;
  min-height: 58px;

  border: 0;
  border-radius: 12px;

  background: #fff;
  color: #111;

  font-family: inherit;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

#metarang-mobile-entry .metarang-hint {
  margin-top: 14px;
  opacity: .78;
  font-size: 13px;
  line-height: 1.9;
}

/* صفحه راهنمای حالت عمودی */
#metarang-orientation-warning {
  position: fixed;
  z-index: 2147483646;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 24px;
  box-sizing: border-box;

  background: #111;
  color: #fff;

  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
  font-size: 18px;
  line-height: 1.9;
}

#metarang-orientation-warning .metarang-card {
  width: min(90vw, 420px);
}

#metarang-orientation-warning button {
  margin-top: 18px;
}

/*
  اگر بعد از چرخش گوشی مرورگر از Fullscreen خارج شود،
  بازی دوباره نمایش داده می‌شود و این دکمه کوچک برای ورود مجدد
  به Fullscreen ظاهر می‌شود.
*/
#metarang-fullscreen-reopen {
  position: fixed;
  z-index: 2147483645;

  right: 12px;
  bottom: 12px;

  display: none;

  min-width: 118px;
  min-height: 44px;

  padding: 8px 14px;

  border: 0;
  border-radius: 10px;

  background: rgba(0, 0, 0, .78);
  color: #fff;

  font-family: Tahoma, Arial, sans-serif;
  font-size: 14px;
  font-weight: 700;

  cursor: pointer;
}
</style>

</head>

<body>

<div id="metarang-mobile-entry">
  <div class="metarang-card">
    <button id="metarang-enter-game" type="button">
      ورود تمام‌صفحه به بازی
    </button>

    <div class="metarang-hint">
      با ورود به بازی، مرورگر تمام‌صفحه می‌شود و حالت افقی فعال می‌شود.
    </div>
  </div>
</div>

<div id="metarang-orientation-warning">
  <div class="metarang-card">
    <div>
      این بازی برای حالت افقی طراحی شده است.<br>
      گوشی را افقی کنید.
    </div>

    <button id="metarang-orientation-fullscreen" type="button">
      بازگشت تمام‌صفحه
    </button>
  </div>
</div>

<button id="metarang-fullscreen-reopen" type="button">
  تمام‌صفحه
</button>


  <div id="unity-container">
    <canvas id="unity-canvas"
            width="1280"
            height="720"
            tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>

      <div id="unity-progress-text">0%</div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <div id="mobile-entry">
    <div class="card">
      <button id="enter-game" type="button">ورود تمام‌صفحه به بازی</button>
      <div class="hint">
        با ورود به بازی، مرورگر تمام‌صفحه می‌شود و حالت افقی فعال می‌شود.
      </div>
    </div>
  </div>

  <div id="orientation-warning">
    این مرورگر اجازهٔ قفل خودکار حالت افقی را نداد.<br>
    برای ادامه، گوشی را افقی کنید.
  </div>

  <script>
    (() => {
      "use strict";

      const container = document.getElementById("unity-container");
      const canvas = document.getElementById("unity-canvas");
      const loadingBar = document.getElementById("unity-loading-bar");
      const progressBarFull = document.getElementById("unity-progress-bar-full");
      const progressText = document.getElementById("unity-progress-text");
      const warningBanner = document.getElementById("unity-warning");
      const mobileEntry = document.getElementById("mobile-entry");
      const enterButton = document.getElementById("enter-game");
      const orientationWarning = document.getElementById("orientation-warning");

      const isMobile =
        /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 1100);

      let unityStarted = false;
      let mobileEntryCompleted = false;

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }

        const div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") {
          div.style = "background:red;padding:10px;";
        } else if (type === "warning") {
          div.style = "background:yellow;padding:10px;";
          setTimeout(() => {
            if (div.parentNode === warningBanner) {
              warningBanner.removeChild(div);
            }
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      function updateViewportHeight() {
        const h =
          (window.visualViewport && window.visualViewport.height) ||
          window.innerHeight ||
          document.documentElement.clientHeight;

        if (h > 0) {
          container.style.height = h + "px";
          canvas.style.height = h + "px";
        }
      }

      function isLandscape() {
        return window.innerWidth > window.innerHeight;
      }

      function refreshOrientationWarning() {
        if (!isMobile || !mobileEntryCompleted) {
          orientationWarning.style.display = "none";
          return;
        }

        orientationWarning.style.display =
          isLandscape() ? "none" : "flex";
      }

      async function requestFullscreenNow() {
        const root = document.documentElement;

        if (document.fullscreenElement || document.webkitFullscreenElement) {
          return true;
        }

        try {
          if (root.requestFullscreen) {
            await root.requestFullscreen({ navigationUI: "hide" });
            return true;
          }

          if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
            return true;
          }
        } catch (error) {
          console.warn("[MetaRang] Fullscreen request rejected:", error);
        }

        return false;
      }

      async function lockLandscapeNow() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            try {
              await screen.orientation.lock("landscape-primary");
              return true;
            } catch (_) {
              await screen.orientation.lock("landscape");
              return true;
            }
          }
        } catch (error) {
          console.warn("[MetaRang] Landscape lock rejected:", error);
        }

        return false;
      }

      async function enterMobileGame() {
        enterButton.disabled = true;

        const fullscreenOk = await requestFullscreenNow();

        let landscapeOk = await lockLandscapeNow();

        if (!landscapeOk && fullscreenOk) {
          await new Promise(resolve => setTimeout(resolve, 120));
          landscapeOk = await lockLandscapeNow();
        }

        mobileEntryCompleted = true;
        mobileEntry.style.display = "none";

        updateViewportHeight();
        refreshOrientationWarning();
        startUnity();
      }

      async function tryRelockAfterFullscreenChange() {
        if (!isMobile || !mobileEntryCompleted) return;

        await lockLandscapeNow();
        updateViewportHeight();
        refreshOrientationWarning();
      }

      function startUnity() {
        if (unityStarted) return;
        unityStarted = true;

        loadingBar.style.display = "block";
        progressBarFull.style.width = "0%";
        progressText.textContent = "0%";

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/a2af7b48e4f57f2c7379b0ab7b84f484.loader.js";

        const config = {
          arguments: [],
          dataUrl: buildUrl + "/2f148ca51c655e15805b8ade77792c11.data.br",
          frameworkUrl: buildUrl + "/8d2248f7b81d4397e3efed586c89ce4c.framework.js.br",
          codeUrl: buildUrl + "/dbb73aff854d7fcab931685915d67454.wasm.br",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "MetaRGB",
          productName: "Client05",
          productVersion: "0.1.0",
          showBanner: unityShowBanner
        };

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            const safeProgress = Math.max(0, Math.min(1, progress || 0));
            const percent = Math.round(safeProgress * 100);

            progressBarFull.style.width = (safeProgress * 100) + "%";
            progressText.textContent = percent + "%";

            updateViewportHeight();
          }).then((unityInstance) => {
            window.unityInstance = unityInstance;
            progressBarFull.style.width = "100%";
            progressText.textContent = "100%";
            loadingBar.style.display = "none";
            updateViewportHeight();
          }).catch((message) => {
            console.error(message);
            loadingBar.style.display = "none";
            unityShowBanner(String(message), "error");
          });
        };

        script.onerror = () => {
          loadingBar.style.display = "none";
          unityShowBanner("Unity WebGL loader failed to load.", "error");
        };

        document.body.appendChild(script);
      }

      enterButton.addEventListener("click", enterMobileGame, { once: true });

      document.addEventListener(
        "fullscreenchange",
        tryRelockAfterFullscreenChange
      );

      document.addEventListener(
        "webkitfullscreenchange",
        tryRelockAfterFullscreenChange
      );

      window.addEventListener("resize", () => {
        updateViewportHeight();
        refreshOrientationWarning();
      });

      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          updateViewportHeight();
          refreshOrientationWarning();
        }, 120);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          updateViewportHeight
        );
      }

      updateViewportHeight();

      if (isMobile) {
        mobileEntry.style.display = "flex";
      } else {
        startUnity();
      }

      window.MetaRangEnterMobileGame = enterMobileGame;
    })();
  </script>

<script id="metarang-mobile-landscape-v2-script">
(function () {
  "use strict";

  var mobileEntry =
    document.getElementById("metarang-mobile-entry");

  var enterButton =
    document.getElementById("metarang-enter-game");

  var orientationWarning =
    document.getElementById("metarang-orientation-warning");

  var orientationFullscreenButton =
    document.getElementById("metarang-orientation-fullscreen");

  var fullscreenReopenButton =
    document.getElementById("metarang-fullscreen-reopen");

  var unityContainer =
    document.getElementById("unity-container");

  var unityCanvas =
    document.getElementById("unity-canvas");

  var isMobile =
    /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (
      navigator.maxTouchPoints > 1 &&
      Math.min(screen.width || 0, screen.height || 0) < 1100
    );

  var entryCompleted = false;

  function isFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement
    );
  }

  function isLandscape() {
    return window.innerWidth > window.innerHeight;
  }

  function updateViewport() {
    var h =
      (window.visualViewport && window.visualViewport.height) ||
      window.innerHeight ||
      document.documentElement.clientHeight;

    var w =
      (window.visualViewport && window.visualViewport.width) ||
      window.innerWidth ||
      document.documentElement.clientWidth;

    if (unityContainer) {
      unityContainer.style.left = "0px";
      unityContainer.style.top = "0px";
      unityContainer.style.transform = "none";

      if (w > 0)
        unityContainer.style.width = w + "px";

      if (h > 0)
        unityContainer.style.height = h + "px";
    }

    if (unityCanvas) {
      if (w > 0)
        unityCanvas.style.width = w + "px";

      if (h > 0)
        unityCanvas.style.height = h + "px";
    }
  }

  function refreshMobileUi() {
    if (!isMobile) {
      mobileEntry.style.display = "none";
      orientationWarning.style.display = "none";
      fullscreenReopenButton.style.display = "none";
      return;
    }

    if (!entryCompleted) {
      mobileEntry.style.display = "flex";
      orientationWarning.style.display = "none";
      fullscreenReopenButton.style.display = "none";
      return;
    }

    mobileEntry.style.display = "none";

    if (!isLandscape()) {
      orientationWarning.style.display = "flex";
      fullscreenReopenButton.style.display = "none";
      return;
    }

    /*
      مهم:
      به محض اینکه کاربر گوشی را دوباره افقی کند،
      Overlay عمودی خودکار حذف می‌شود و خود بازی دوباره دیده می‌شود.
    */
    orientationWarning.style.display = "none";

    /*
      بعضی مرورگرها هنگام چرخش از Fullscreen خارج می‌شوند.
      Fullscreen دوباره بدون gesture قابل اجبار نیست؛
      بنابراین خود بازی نمایش داده می‌شود و فقط یک دکمه کوچک
      برای بازگشت به Fullscreen نشان داده می‌شود.
    */
    fullscreenReopenButton.style.display =
      isFullscreen() ? "none" : "block";
  }

  async function requestFullscreenNow() {
    var root = document.documentElement;

    if (isFullscreen())
      return true;

    try {
      if (root.requestFullscreen) {
        await root.requestFullscreen({
          navigationUI: "hide"
        });

        return true;
      }

      if (root.webkitRequestFullscreen) {
        root.webkitRequestFullscreen();
        return true;
      }
    } catch (error) {
      console.warn(
        "[MetaRang] Fullscreen request rejected:",
        error
      );
    }

    return false;
  }

  async function lockLandscapeNow() {
    try {
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock("landscape-primary");
          return true;
        } catch (_) {
          await screen.orientation.lock("landscape");
          return true;
        }
      }
    } catch (error) {
      console.warn(
        "[MetaRang] Landscape lock rejected:",
        error
      );
    }

    return false;
  }

  async function requestFullscreenAndLandscape() {
    var fullscreenOk = await requestFullscreenNow();

    var landscapeOk =
      await lockLandscapeNow();

    if (!landscapeOk && fullscreenOk) {
      await new Promise(function (resolve) {
        setTimeout(resolve, 120);
      });

      await lockLandscapeNow();
    }

    updateViewport();
    refreshMobileUi();
  }

  async function enterGame() {
    enterButton.disabled = true;

    await requestFullscreenAndLandscape();

    entryCompleted = true;

    updateViewport();
    refreshMobileUi();
  }

  async function reopenFullscreen() {
    await requestFullscreenAndLandscape();

    updateViewport();
    refreshMobileUi();
  }

  async function handleFullscreenChange() {
    if (
      isMobile &&
      entryCompleted &&
      isFullscreen() &&
      isLandscape()
    ) {
      await lockLandscapeNow();
    }

    updateViewport();
    refreshMobileUi();
  }

  function handleOrientationOrResize() {
    /*
      مرورگرهای موبایل viewport را طی چند فریم عوض می‌کنند.
      دو مرحله refresh می‌کنیم تا Overlay در landscape گیر نکند.
    */
    updateViewport();
    refreshMobileUi();

    setTimeout(function () {
      updateViewport();
      refreshMobileUi();
    }, 120);

    setTimeout(function () {
      updateViewport();
      refreshMobileUi();
    }, 420);
  }

  enterButton.addEventListener(
    "click",
    enterGame,
    { once: true }
  );

  orientationFullscreenButton.addEventListener(
    "click",
    reopenFullscreen
  );

  fullscreenReopenButton.addEventListener(
    "click",
    reopenFullscreen
  );

  document.addEventListener(
    "fullscreenchange",
    handleFullscreenChange
  );

  document.addEventListener(
    "webkitfullscreenchange",
    handleFullscreenChange
  );

  window.addEventListener(
    "resize",
    handleOrientationOrResize
  );

  window.addEventListener(
    "orientationchange",
    handleOrientationOrResize
  );

  window.addEventListener(
    "pageshow",
    handleOrientationOrResize
  );

  document.addEventListener(
    "visibilitychange",
    function () {
      if (!document.hidden)
        handleOrientationOrResize();
    }
  );

  if (window.visualViewport) {
    window.visualViewport.addEventListener(
      "resize",
      handleOrientationOrResize
    );
  }

  updateViewport();

  if (isMobile)
    mobileEntry.style.display = "flex";

  refreshMobileUi();

  window.MetaRangEnterMobileGame =
    enterGame;

  window.MetaRangRefreshMobileLayout =
    handleOrientationOrResize;
})();
</script>

</body>
